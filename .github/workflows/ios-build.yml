name: Build SimpleX iOS Standalone
on:
  workflow_dispatch: # 仅手动触发

jobs:
  build-ios:
    # 依然使用 macOS 15 Intel
    runs-on: macos-15-intel
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 安装 Nix (DeterminateSystems)
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            substituters = https://cache.nixos.org https://cache.zw3rk.com

      # 2. 启用 Magic Cache
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # 3. 构建 iOS 静态库 (使用我们在 flake show 中发现的准确名称)
      - name: Build Haskell Static Lib for iOS
        run: |
          echo "Building Haskell Core for iOS..."
          
          # 关键修正：使用 flake show 输出的确切名称
          # 注意：需要在名称上加引号，因为包含冒号
          nix build .#x86_64-darwin-ios:lib:simplex-chat \
            --max-jobs 1 \
            --cores 1 \
            --accept-flake-config \
            -v
          
          echo "Copying libraries..."
          mkdir -p apps/ios/SimpleXChat/Lib
          
          # Nix 构建产物通常在 ./result 链接中
          # 如果是 lib 类型，里面应该有 .a 文件
          cp -L result/lib/*.a apps/ios/SimpleXChat/Lib/ || echo "Copy failed or no .a files found"
          
          # 验证
          ls -R apps/ios/SimpleXChat/Lib/

      # 4. 安装 CocoaPods
      - name: Install Dependencies
        run: |
          cd apps/ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      # 5. 打包 IPA
      - name: Archive and Export IPA
        run: |
          cd apps/ios
          mkdir -p build 

          xcodebuild archive \
            -workspace SimpleXChat.xcworkspace \
            -scheme SimpleXChat \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/SimpleXChat.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/SimpleXChat.xcarchive/Products/Applications/SimpleXChat.app build/Payload/
          cd build
          zip -r SimpleXChat.ipa Payload

      # 6. 上传
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleXChat-iOS-Unsigned
          path: apps/ios/build/SimpleXChat.ipa
