name: Build SimpleX iOS Standalone
on:
  workflow_dispatch: # 仅手动触发

jobs:
  build-ios:
    # 使用 macOS 15 Intel (GitHub 推荐的配置)
    runs-on: macos-15-intel
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 安装 Nix (改用 DeterminateSystems，完美解决 macOS 15 UID 冲突)
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          # 在这里配置额外的缓存服务器，加速构建
          extra-conf: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            substituters = https://cache.nixos.org https://cache.zw3rk.com

      # 2. 启用 Magic Cache (可选，进一步尝试利用 Nix 缓存)
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Show flake outputs
        run: |
          nix --version
          nix flake show --all-systems
          
      # 3. 构建 iOS 静态库
      # 依然保持单核串行编译，防止 14GB 内存溢出
      - name: Build Haskell Static Lib for iOS
        run: |
          echo "Building Haskell Core with low concurrency..."
          
          # 限制并发为 1
          nix build .#simplex-chat-ios-static \
            --max-jobs 1 \
            --cores 1 \
            --accept-flake-config \
            -v
          
          echo "Copying libraries..."
          mkdir -p apps/ios/SimpleXChat/Lib
          # 尝试复制 .a 文件
          cp -L result/lib/*.a apps/ios/SimpleXChat/Lib/ || echo "Warning: Auto-copy failed"

      # 4. 安装 CocoaPods 依赖
      - name: Install Dependencies
        run: |
          cd apps/ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      # 5. 打包 IPA
      - name: Archive and Export IPA
        run: |
          cd apps/ios
          mkdir -p build 

          xcodebuild archive \
            -workspace SimpleXChat.xcworkspace \
            -scheme SimpleXChat \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/SimpleXChat.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/SimpleXChat.xcarchive/Products/Applications/SimpleXChat.app build/Payload/
          cd build
          zip -r SimpleXChat.ipa Payload

      # 6. 上传产物
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleXChat-iOS-Unsigned
          path: apps/ios/build/SimpleXChat.ipa
